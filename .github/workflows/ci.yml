name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arandas
          POSTGRES_PASSWORD: arandas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arandas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://arandas:arandas@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The agent team files must match their sources and stay inside OpenMausBot's documented limits.
      - run: npm run agents:check
      - run: npm run typecheck
      # Applies every migration to a fresh PostgreSQL, then runs all tests. Fails under 60% line coverage.
      - run: npm test
      # The site's translation test fails when a text has no Arabic. Then the site must build.
      - run: npm test -w @arandas/web
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  owner-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/owner
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test integration
      - run: flutter analyze
      # Fails under 60% line coverage, the same floor as the company's public site.
      - run: flutter test --coverage
      - run: sh tool/check_coverage.sh 60
      - run: flutter build web --release --wasm
