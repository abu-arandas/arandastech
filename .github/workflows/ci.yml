name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zirr
          POSTGRES_PASSWORD: zirr
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zirr" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://zirr:zirr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The agent team files must match their sources and stay inside OpenMausBot's documented limits.
      - run: npm run agents:check
      - run: npm run typecheck
      # Lint also keeps every file under 800 lines and every function under 120 (eslint.config.mjs).
      - run: npm run lint
      # No unused files, exports or dependencies.
      - run: npm run deadcode
      - run: npm run format
      # Applies every migration to a fresh PostgreSQL, then runs all tests: the platform's (fails under 60% line coverage)
      # and the site's translation test (fails when a text has no Arabic). Then the site must build.
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  owner-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/owner
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib tool
      - run: flutter analyze
      - run: tool/check_layers.sh
      - run: node tool/check_arabic.mjs
      # The address only names the platform; the build holds no secrets.
      - run: flutter build web --release --wasm --dart-define=PLATFORM_URL=https://zirr-platform-ehab-arandas.vercel.app
